name: Slack Feed

# Posts one line to the maintainers' Slack channel for each new or closed issue,
# new comment, new or closed pull request, and published release.
#
# Anyone can open an issue or comment here, so this workflow runs on input from
# strangers while it holds a secret. Keep it that way:
#   - No checkout and no third-party actions: only curl and jq on the runner.
#   - `permissions: {}`, so GITHUB_TOKEN can do nothing.
#   - Event fields are read from $GITHUB_EVENT_PATH with jq, never written into
#     the script with ${{ }}, and never echoed: a log line starting with `::`
#     is a workflow command.
#   - It only posts. It never reads from Slack, because run logs are public.
#   - The secret is a Slack incoming webhook, which can post to one channel and
#     read nothing.
#
# pull_request_target is what lets pull requests from forks be announced. It is
# safe here only because the job never checks out or runs their code.

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code runs
    types: [opened, closed, reopened]
  # GoReleaser publishes the release with GITHUB_TOKEN, which starts no other
  # workflow, so a release is announced when the Release workflow succeeds.
  workflow_run: # zizmor: ignore[dangerous-triggers] filtered to tag pushes in this repository
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  post:
    name: Post to Slack
    # Forks have no webhook. A workflow_run counts only when this repository's
    # release.yml succeeded on a tag push: a pull request can add its own
    # workflow named "Release", but its run is a pull_request event.
    if: >-
      github.repository == 'laravel/terraform-provider-laravel' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.path == '.github/workflows/release.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_FEED_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Dependabot runs get Dependabot's secrets, not these, so they land here too.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice::SLACK_FEED_WEBHOOK_URL is not set, so nothing was posted."
            exit 0
          fi

          payload=$(jq --compact-output --from-file /dev/stdin "$GITHUB_EVENT_PATH" <<'JQ'
          # Slack needs &, < and > escaped in message text. Escaping them also
          # stops text from strangers forming mentions such as <!channel>, or
          # links that show one address and open another.
          def esc: tostring | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def link(url; text): "<\(url | esc)|\(text | esc)>";
          def user(u): link(u.html_url; u.login);
          def item(x): link(x.html_url; "#\(x.number) \(x.title)");

          $ENV.GITHUB_EVENT_NAME as $event
          | if $event == "issues" then
              if .action == "opened" then ":new: Issue \(item(.issue)) opened by \(user(.sender))"
              elif .action == "closed" then "Issue \(item(.issue)) closed as \(.issue.state_reason // "completed" | gsub("_"; " ")) by \(user(.sender))"
              else "Issue \(item(.issue)) reopened by \(user(.sender))"
              end
            elif $event == "issue_comment" then
              "\(user(.sender)) \(link(.comment.html_url; "commented")) on \(if .issue.pull_request then "pull request" else "issue" end) \(item(.issue))"
            elif $event == "pull_request_target" then
              if .action == "opened" then "Pull request \(item(.pull_request)) opened by \(user(.sender))"
              elif .action == "closed" and .pull_request.merged then "Pull request \(item(.pull_request)) merged by \(user(.pull_request.merged_by // .sender))"
              elif .action == "closed" then "Pull request \(item(.pull_request)) closed by \(user(.sender))"
              else "Pull request \(item(.pull_request)) reopened by \(user(.sender))"
              end
            elif $event == "workflow_run" then
              .workflow_run.head_branch as $tag
              | if ($tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))
                then ":rocket: Release \(link("\(.repository.html_url)/releases/tag/\($tag)"; $tag)) published"
                else empty
                end
            else empty
            end
          # link_names off: plain "@channel" in a title must stay plain text.
          | {text: ., link_names: false, unfurl_links: false, unfurl_media: false}
          JQ
          )

          if [ -z "$payload" ]; then
            echo "Nothing to post for this event."
            exit 0
          fi

          # Slack answers "ok", or an error code such as invalid_payload. Neither
          # contains event text, so the error is safe to print.
          if ! response=$(curl --silent --show-error --fail-with-body --max-time 20 --retry 3 \
            --header 'Content-Type: application/json' --data-binary @- \
            "$SLACK_WEBHOOK_URL" <<<"$payload"); then
            echo "::error::Slack did not accept the message: ${response}"
            exit 1
          fi
