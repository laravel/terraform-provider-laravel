name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        run: go build -v ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests
        run: go test ./... -count=1 -parallel=4 -timeout 30s

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run go vet
        run: go vet ./...

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

  # docs/ is generated from the provider schema plus examples/. If a schema
  # description or an example changes without regenerating, the Registry pages
  # silently go stale -- so the drift is a build failure, not a review comment.
  docs:
    name: Docs Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Regenerate docs
        run: make generate

      - name: Fail if docs are stale
        run: |
          # `git diff` compares the index to the working tree and never sees
          # untracked files, so a brand-new docs page -- exactly what adding a
          # resource produces -- slipped through and this required check went
          # green with the new resource undocumented. `git status --porcelain`
          # reports untracked files too.
          CHANGES=$(git status --porcelain -- docs/)
          if [ -n "$CHANGES" ]; then
            echo "ERROR: docs/ is out of date. Run 'make generate' and commit the result."
            echo
            echo "$CHANGES"
            echo
            git diff -- docs/
            exit 1
          fi
          echo "docs/ is up to date"

  # Plan-check tests run a real terraform plan/apply against an in-memory fake
  # of the Cloud API, so they need no token and create nothing. That makes them
  # cheap enough to run across the Terraform versions the README claims support
  # for -- the compatibility surface acceptance tests never exercise.
  plan:
    name: Plan Tests (TF ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.0.*", "1.8.*", "latest"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Run plan-check tests
        env:
          TF_ACC: "1"
        run: go test ./internal/provider/ -count=1 -run 'Plan$' -timeout 15m

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build, test, vet]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Acceptance tests create real resources in one shared Cloud account, so
    # overlapping runs collide on names and quota. Queue them instead.
    # cancel-in-progress is deliberately false: cancelling mid-apply would
    # orphan real infrastructure rather than destroying it.
    concurrency:
      group: acceptance-${{ github.repository }}
      cancel-in-progress: false
    env:
      TF_ACC: "1"
      LARAVEL_CLOUD_API_TOKEN: ${{ secrets.LARAVEL_CLOUD_API_TOKEN }}
      LARAVEL_CLOUD_BASE_URL: ${{ secrets.LARAVEL_CLOUD_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Run acceptance tests
        run: go test ./... -v -count=1 -parallel=4 -timeout 60m
